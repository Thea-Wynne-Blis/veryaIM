# 本地开发 profile：H2 内存库 + 单机在线状态，无需外部依赖即可启动。
spring:
  datasource:
    url: jdbc:h2:mem:veryal;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema.sql
  flyway:
    enabled: false

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false

veryal:
  redis:
    enabled: false
  mq:
    enabled: false
  security:
    token:
      secret: dev-only-secret-please-change-0123456789abcdef

server:
  port: 8080
  shutdown: graceful
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}

spring:
  application:
    name: veryal
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 15s
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # 单次 multipart 只承接小文件；大文件（视频）由前端切成分片。
      max-file-size: 32MB
      max-request-size: 36MB
  datasource:
    url: jdbc:mysql://localhost:3306/veryal_im?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: veryal
    password: veryal
    hikari:
      maximum-pool-size: 32
      minimum-idle: 8
      connection-timeout: 3000
      pool-name: veryal-hikari
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:veryal}
    password: ${SPRING_RABBITMQ_PASSWORD:veryal}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 50
        concurrency: 2
        max-concurrency: 8
        missing-queues-fatal: false

mybatis-plus:
  # 多表 / 子查询 / 多条件查询的 SQL 写在 resources/mapper/*.xml，
  # 注解只保留单表点查与写操作。
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
  global-config:
    banner: false
    db-config:
      id-type: input

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

veryal:
  node-id: ${VERYAL_NODE_ID:1}
  gateway:
    id: ${VERYAL_GATEWAY_ID:gateway-local}
    max-frame-length: 1048576
    heartbeat-idle: 90s
    login-timeout: 10s
    business-threads: 16
    business-queue-capacity: 10000
    business-executor: ${VERYAL_GATEWAY_BUSINESS_EXECUTOR:platform}
    business-concurrency: ${VERYAL_GATEWAY_BUSINESS_CONCURRENCY:256}
    websocket:
      enabled: true
      port: 9098
      path: /ws
    tls:
      enabled: ${VERYAL_TLS_ENABLED:false}
      cert-path: ${VERYAL_TLS_CERT:}
      key-path: ${VERYAL_TLS_KEY:}
      key-password: ${VERYAL_TLS_KEY_PASSWORD:}
    max-connections: ${VERYAL_GATEWAY_MAX_CONNECTIONS:0}
    max-connections-per-ip: ${VERYAL_GATEWAY_MAX_CONNECTIONS_PER_IP:0}
  realtime:
    fanout:
      # 本节点扇出线程数；0 表示退回同步扇出（请求线程内逐个连接写入）
      threads: ${VERYAL_REALTIME_FANOUT_THREADS:2}
      # 有界队列，满了丢最旧任务，客户端靠轮询/游标补齐
      queue-capacity: ${VERYAL_REALTIME_FANOUT_QUEUE:10000}
  security:
    token:
      issuer: veryal
      ttl: 7d
  redis:
    enabled: ${VERYAL_REDIS_ENABLED:true}
  presence:
    # 在线状态在 Redis 的 TTL 是 5 分钟，这里每分钟给本机连接续期；
    # 浏览器只发应用层 ping，不能靠它维持 Redis 里的在线标记。
    renew-interval-ms: ${VERYAL_PRESENCE_RENEW_INTERVAL_MS:60000}
  mq:
    enabled: ${VERYAL_MQ_ENABLED:false}
  outbox:
    batch-size: 100
    poll-interval-ms: 500
    max-retries: 5
    confirm-timeout-ms: 5000
    stale-timeout-ms: 60000
  rate-limit:
    enabled: ${VERYAL_RATE_LIMIT_ENABLED:true}
    policies:
      - name: http-login
        algorithm: SLIDING_WINDOW
        permits: ${VERYAL_RATE_LIMIT_LOGIN_PERMITS:10}
        window-seconds: 60
      - name: http-api
        algorithm: TOKEN_BUCKET
        permits: ${VERYAL_RATE_LIMIT_API_PERMITS:200}
        refill-per-second: ${VERYAL_RATE_LIMIT_API_REFILL:50}
      - name: gateway-login
        algorithm: SLIDING_WINDOW
        permits: ${VERYAL_RATE_LIMIT_GATEWAY_LOGIN_PERMITS:10}
        window-seconds: 60
      - name: message-send
        algorithm: TOKEN_BUCKET
        permits: ${VERYAL_RATE_LIMIT_MESSAGE_PERMITS:30}
        refill-per-second: ${VERYAL_RATE_LIMIT_MESSAGE_REFILL:15}
  storage:
    type: ${VERYAL_STORAGE_TYPE:local}
    local:
      root-path: ${VERYAL_STORAGE_LOCAL_ROOT:./data/files}
    minio:
      endpoint: ${VERYAL_MINIO_ENDPOINT:}
      access-key: ${VERYAL_MINIO_ACCESS_KEY:}
      secret-key: ${VERYAL_MINIO_SECRET_KEY:}
      bucket: ${VERYAL_MINIO_BUCKET:veryal}
    oss:
      endpoint: ${VERYAL_OSS_ENDPOINT:}
      access-key-id: ${VERYAL_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${VERYAL_OSS_ACCESS_KEY_SECRET:}
      bucket: ${VERYAL_OSS_BUCKET:veryal}
  upload:
    staging-path: ${VERYAL_UPLOAD_STAGING:./data/uploads}
    chunk-size-bytes: ${VERYAL_UPLOAD_CHUNK_SIZE:5242880}
    # 分片合并是流式写盘，256MB 只需磁盘空间，不会整份进堆。
    max-size-bytes: ${VERYAL_UPLOAD_MAX_SIZE:268435456}
  platform:
    token-secret: ${VERYAL_PLATFORM_TOKEN_SECRET:}
    bootstrap-username: ${VERYAL_PLATFORM_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${VERYAL_PLATFORM_BOOTSTRAP_PASSWORD:}
    bootstrap-display-name: ${VERYAL_PLATFORM_BOOTSTRAP_DISPLAY_NAME:Platform Admin}
  push:
    provider: ${VERYAL_PUSH_PROVIDER:none}
    webhook-url: ${VERYAL_PUSH_WEBHOOK_URL:}
    webhook-token: ${VERYAL_PUSH_WEBHOOK_TOKEN:}
    fcm:
      project-id: ${VERYAL_PUSH_FCM_PROJECT_ID:}
      service-account-json: ${VERYAL_PUSH_FCM_SERVICE_ACCOUNT_JSON:}
    apns:
      team-id: ${VERYAL_PUSH_APNS_TEAM_ID:}
      key-id: ${VERYAL_PUSH_APNS_KEY_ID:}
      private-key-path: ${VERYAL_PUSH_APNS_PRIVATE_KEY_PATH:}
      topic: ${VERYAL_PUSH_APNS_TOPIC:}
      production: ${VERYAL_PUSH_APNS_PRODUCTION:false}
    web-push:
      enabled: ${VERYAL_PUSH_WEB_PUSH_ENABLED:false}
      subject: ${VERYAL_PUSH_WEB_PUSH_SUBJECT:mailto:admin@example.com}
      public-key: ${VERYAL_PUSH_WEB_PUSH_PUBLIC_KEY:}
      private-key: ${VERYAL_PUSH_WEB_PUSH_PRIVATE_KEY:}
      key-file: ${VERYAL_PUSH_WEB_PUSH_KEY_FILE:./data/vapid-keys.json}
      ttl-seconds: ${VERYAL_PUSH_WEB_PUSH_TTL:86400}
      max-subscriptions-per-user: ${VERYAL_PUSH_WEB_PUSH_MAX_SUBS:10}
  translate:
    # 百度翻译通用 API：密钥只放服务端环境变量，仓库只留空默认值。
    app-id: ${VERYAL_TRANSLATE_APP_ID:}
    secret: ${VERYAL_TRANSLATE_SECRET:}
    endpoint: ${VERYAL_TRANSLATE_ENDPOINT:https://fanyi-api.baidu.com/api/trans/vip/translate}

logging:
  level:
    root: INFO
    com.veryal: INFO

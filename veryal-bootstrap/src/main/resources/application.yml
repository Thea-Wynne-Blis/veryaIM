server:
  port: 8080
  shutdown: graceful
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}

spring:
  application:
    name: veryal
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 15s
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  cache:
    type: caffeine
    cache-names: user
    caffeine:
      spec: maximumSize=100000,expireAfterWrite=10m,recordStats
  datasource:
    url: jdbc:mysql://localhost:3306/veryal_im?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: veryal
    password: veryal
    hikari:
      maximum-pool-size: 32
      minimum-idle: 8
      connection-timeout: 3000
      pool-name: veryal-hikari
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:veryal}
    password: ${SPRING_RABBITMQ_PASSWORD:veryal}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 50
        concurrency: 2
        max-concurrency: 8
        missing-queues-fatal: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
  global-config:
    banner: false
    db-config:
      id-type: input

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

veryal:
  node-id: ${VERYAL_NODE_ID:1}
  gateway:
    id: ${VERYAL_GATEWAY_ID:gateway-local}
    max-frame-length: 1048576
    heartbeat-idle: 90s
    login-timeout: 10s
    business-threads: 16
    business-queue-capacity: 10000
    tcp:
      enabled: true
      port: 9099
    websocket:
      enabled: true
      port: 9098
      path: /ws
    tls:
      enabled: ${VERYAL_TLS_ENABLED:false}
      cert-path: ${VERYAL_TLS_CERT:}
      key-path: ${VERYAL_TLS_KEY:}
      key-password: ${VERYAL_TLS_KEY_PASSWORD:}
    max-connections: ${VERYAL_GATEWAY_MAX_CONNECTIONS:0}
    max-connections-per-ip: ${VERYAL_GATEWAY_MAX_CONNECTIONS_PER_IP:0}
  security:
    token:
      issuer: veryal
      ttl: 7d
  redis:
    enabled: ${VERYAL_REDIS_ENABLED:true}
  mq:
    enabled: ${VERYAL_MQ_ENABLED:false}
  outbox:
    batch-size: 100
    poll-interval-ms: 500
    max-retries: 5
    confirm-timeout-ms: 5000
    stale-timeout-ms: 60000
  rate-limit:
    policies:
      - name: http-login
        algorithm: SLIDING_WINDOW
        permits: 10
        window-seconds: 60
      - name: http-api
        algorithm: TOKEN_BUCKET
        permits: 200
        refill-per-second: 50
      - name: tcp-login
        algorithm: SLIDING_WINDOW
        permits: 10
        window-seconds: 60
      - name: message-send
        algorithm: TOKEN_BUCKET
        permits: 30
        refill-per-second: 15

logging:
  level:
    root: INFO
    com.veryal: INFO

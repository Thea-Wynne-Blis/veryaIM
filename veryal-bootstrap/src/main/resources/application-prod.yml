# 生产 / Docker profile：MySQL + Redis + Flyway。
spring:
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  datasource:
    url: ${VERYAL_DB_URL:jdbc:mysql://mysql:3306/veryal_im?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&rewriteBatchedStatements=true}
    username: ${VERYAL_DB_USER:veryal}
    password: ${VERYAL_DB_PASSWORD:veryal}
  flyway:
    enabled: true
  data:
    redis:
      host: ${VERYAL_REDIS_HOST:redis}
      port: ${VERYAL_REDIS_PORT:6379}
      password: ${VERYAL_REDIS_PASSWORD:}
      timeout: 2s
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:veryal}
    password: ${SPRING_RABBITMQ_PASSWORD:veryal}

# 生产默认关闭 OpenAPI 文档：/v3/api-docs 与 /swagger-ui 不在 /api/v1 鉴权范围内，
# 打开就等于把完整接口清单暴露在公网；需要时用 VERYAL_OPENAPI_ENABLED=true 临时打开。
springdoc:
  api-docs:
    enabled: ${VERYAL_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${VERYAL_OPENAPI_ENABLED:false}

veryal:
  node-id: ${VERYAL_NODE_ID:1}
  gateway:
    id: ${VERYAL_GATEWAY_ID:gateway-1}
    business-executor: ${VERYAL_GATEWAY_BUSINESS_EXECUTOR:virtual}
    business-concurrency: ${VERYAL_GATEWAY_BUSINESS_CONCURRENCY:512}
  redis:
    enabled: ${VERYAL_REDIS_ENABLED:true}
  mq:
    enabled: ${VERYAL_MQ_ENABLED:true}
  security:
    token:
      secret: ${VERYAL_TOKEN_SECRET}

management:
  health:
    redis:
      enabled: true

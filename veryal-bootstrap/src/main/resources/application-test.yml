# 集成测试 profile：H2 + 随机端口，避免占用本机端口。
spring:
  datasource:
    url: jdbc:h2:mem:veryal_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema.sql
  flyway:
    enabled: false

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false

veryal:
  node-id: 99
  redis:
    enabled: false
  mq:
    enabled: false
  storage:
    type: local
    local:
      root-path: target/test-files
  upload:
    staging-path: target/test-uploads
    chunk-size-bytes: 4
    max-size-bytes: 1024
  tenant:
    admin-token: test-admin-token
  rate-limit:
    policies:
      - name: http-login
        algorithm: SLIDING_WINDOW
        permits: 1000
        window-seconds: 60
      - name: http-api
        algorithm: TOKEN_BUCKET
        permits: 10000
        refill-per-second: 10000
      - name: tcp-login
        algorithm: SLIDING_WINDOW
        permits: 1000
        window-seconds: 60
      - name: message-send
        algorithm: TOKEN_BUCKET
        permits: 5
        refill-per-second: 0
  security:
    token:
      secret: test-only-secret-please-change-0123456789abcdef
  gateway:
    id: gateway-test
    heartbeat-idle: 30s
    login-timeout: 5s
    business-threads: 4
    business-queue-capacity: 1000
    tcp:
      port: 0
    websocket:
      port: 0

logging:
  level:
    root: WARN
    com.veryal: INFO
